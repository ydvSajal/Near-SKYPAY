# Render Blueprint: the SkyPay backend (Express + Prisma). Frontend goes on Vercel, database on Neon.
# Schema is pushed to Neon once from a dev machine (`npx prisma db push`), not on every build.
#
# Free plan caveat: free web services sleep after 15 min idle and cold-start (~30-50 s).
# The outbox worker (emails, Notion) only runs while the service is awake. Fine for a demo.
#
# `sync: false` vars are prompted for on first apply; paste them in the Render dashboard.

services:
  - type: web
    name: skypay-near-api
    runtime: node
    region: virginia
    plan: free
    rootDir: agenPay/agenpay-backend
    buildCommand: npm ci && npx prisma generate && npm run admin:seed
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL          # Neon pooled connection string
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NEAR_KEY_ENC_SECRET   # encrypts agent keys at rest; generated once, do not rotate with live users
        generateValue: true
      - key: FRONTEND_URL          # Vercel URL (CORS + links in emails)
        sync: false
      - key: BASE_URL              # this service's public URL (x402 pay links)
        sync: false
      - key: NEAR_NETWORK
        value: testnet
      - key: NEAR_RPC_URL
        value: https://test.rpc.fastnear.com
      - key: NEAR_USDC_IS_TEST_TOKEN
        value: "true"
      - key: NEAR_RELAYER_ACCOUNT  # from `npm run near:bootstrap` (.env.near)
        sync: false
      - key: NEAR_RELAYER_KEY
        sync: false
      - key: NEAR_USDC_CONTRACT
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: NOTION_CLIENT_ID
        sync: false
      - key: NOTION_CLIENT_SECRET
        sync: false
      - key: NOTION_REDIRECT_URI   # https://<this service>.onrender.com/api/notion/callback
        sync: false
      - key: EMAIL_SERVICE
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL           # optional: admin portal seed on build; leave both empty to skip
        sync: false
      - key: ADMIN_PASSWORD        # optional, min 8 chars
        sync: false
