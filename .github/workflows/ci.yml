# CI — runs on every push/PR to main and hackathon-near. No secrets, no network calls to NEAR.

name: CI

on:
  push:
    branches: [main, hackathon-near]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Vault contract (Rust unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests (policy, limits, replay, callbacks)
        run: cargo test -p skypay-vault --lib

  backend:
    name: Backend (Express + Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agenPay/agenpay-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agenPay/agenpay-backend/package-lock.json
      - run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      - name: Syntax-check
        run: |
          node --check server.js
          for f in lib/*.js lib/near/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Unit tests (money, CSV injection, relay guard, settlement verification)
        run: npm test

  frontend:
    name: Frontend (Next.js build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agenPay/agenpay-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agenPay/agenpay-frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
